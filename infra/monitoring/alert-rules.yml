# infra/monitoring/alert-rules.yml — Prometheus alerting rules
# T-M5-03c: BackupFailure 规则
# T-M5-05b: 完整规则集将在此基础上扩展
#
# 由 Alertmanager 消费（T-M5-05a 部署）。
#
# ── 指标来源（H2 修复）──────────────────────────────────────────
# 这些规则消费下列指标，分别由对应脚本通过 PROMETHEUS_TEXTFILE_DIR 写入 .prom 文件：
#
#   backup_last_success_timestamp_seconds   backup.sh          (成功时刻，Unix 时间戳)
#   backup_last_exit_code                   backup.sh          (最近一次退出码)
#   backup_files_count                      backup.sh (目录中备份文件数)
#   backup_verify_exit_code                 verify-backup.sh   (校验脚本退出码)
#
# 部署时需确保 node_exporter 的 --collector.textfile.directory 指向脚本写入的目录，
# 或使用 pushgateway 由脚本主动推送（backup.sh 已支持 textfile，可改为推送）。
# 若该部署未接通指标采集，本文件中的规则将永远不触发（no-data ≠ healthy）。
#
# ── runbook_url 说明（M7 修复）────────────────────────────────
# runbook_url 为仓库相对路径。部署时需：
#   (a) 替换为仓库托管平台（GitHub/GitLab）的绝对 URL，或
#   (b) 通过 alertmanager 的 route 配置将 annotation 映射为可点击链接。
# 当前值仅为人工参考。

group_name: &default_runbook docs/runbooks/disaster-recovery.md

groups:
  - name: backup
    interval: 60s
    rules:
      # ── 备份文件新鲜度 ──
      # 如果最新备份文件超过 26 小时未更新（窗口 UTC 03:00 + 2h 容忍），触发告警
      - alert: BackupStale
        expr: |
          (time() - backup_last_success_timestamp_seconds) > 93600
        for: 10m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "数据库备份超过 26 小时未成功"
          description: |
            最新备份时间戳 {{ "{{" }} $value | humanizeTimestamp {{ "}}" }} 距今超过 26 小时。
            检查 backup 容器日志和 BACKUP_DIR 磁盘空间。
          runbook_url: *default_runbook

      # ── 备份失败 ──
      # 通过 textfile-collector 暴露 backup_last_exit_code 指标
      - alert: BackupFailure
        expr: |
          backup_last_exit_code != 0
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "pg_dump 备份失败（exit code != 0）"
          description: |
            最近一次 pg_dump 退出码 {{ "{{" }} $value {{ "}}" }}。
            检查 FAILURE_MARKER 文件及 backup 容器日志。
          runbook_url: *default_runbook

      # ── 备份文件缺失 ──
      # backup_files_count == 0 表示 BACKUP_DIR 中无任何 .dump 文件
      - alert: BackupMissing
        expr: |
          backup_files_count == 0
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "备份目录无任何备份文件"
          description: |
            BACKUP_DIR 中备份文件数为 0。可能是备份从未运行或被意外清理。
          runbook_url: *default_runbook

      # ── 备份校验失败 ──
      - alert: BackupVerifyFailed
        expr: |
          backup_verify_exit_code != 0
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "备份完整性校验失败"
          description: |
            verify-backup.sh 退出码 {{ "{{" }} $value {{ "}}" }}。
            恢复抽样库后断言未通过，可能备份文件损坏。
          runbook_url: *default_runbook

  # ════════════════════════════════════════════════════════════════════════════
  # T-M5-05b: API SLO 告警（S0/S1）
  # 指标来源：server/src/common/telemetry.py → api_requests_total / api_errors_total
  # ════════════════════════════════════════════════════════════════════════════
  - name: api_slo
    interval: 60s
    rules:
      # ── S0: API 可用性跌破 99.9% ──
      # 5 分钟窗口内错误率 > 0.1%
      - alert: ApiAvailabilityLow
        expr: |
          (
            sum(rate(api_errors_total[5m]))
            /
            (sum(rate(api_requests_total[5m])) > 0)
          ) > 0.001
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "API 错误率超过 0.1%（S0）"
          description: |
            最近 5 分钟 API 错误率 {{ "{{" }} $value | humanizePercentage {{ "}}" }}，
            超过 S0 阈值 0.1%。检查 API 日志及依赖服务（PostgreSQL、Redis、AI provider）。
          runbook_url: docs/runbooks/api-slo.md

      # ── S1: p95 延迟超过 500ms ──
      - alert: ApiLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(api_request_duration_ms_bucket[5m])) by (le)
          ) > 500
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "API p95 延迟超过 500ms（S1）"
          description: |
            API p95 延迟 {{ "{{" }} $value {{ "}}" }} ms，超过 S1 阈值 500ms。
            检查慢查询、下游服务延迟、资源利用率。
          runbook_url: docs/runbooks/api-slo.md

  # ════════════════════════════════════════════════════════════════════════════
  # T-M5-05b: Android 崩溃率告警（S0）
  # 指标来源：POST /telemetry/crash → crash_reports_total (counter)
  #          crash_free_rate = 1 - (crash_reports_total / active_devices)
  # ════════════════════════════════════════════════════════════════════════════
  - name: android_health
    interval: 60s
    rules:
      # ── S0: crash-free session 率跌破 99.5% ──
      - alert: CrashFreeRateLow
        expr: |
          (
            1 - (
              sum(increase(crash_reports_total[24h]))
              /
              (sum(active_devices_total) > 0)
            )
          ) < 0.995
        for: 30m
        labels:
          severity: critical
          team: mobile
        annotations:
          summary: "Android crash-free 率低于 99.5%（S0）"
          description: |
            最近 24h crash-free session 率 {{ "{{" }} $value | humanizePercentage {{ "}}" }}。
            检查最近 release 的崩溃趋势及 mapping 文件。
          runbook_url: docs/runbooks/android-crash.md

  # ════════════════════════════════════════════════════════════════════════════
  # T-M5-05b: 同步队列告警（S1）
  # 指标来源：server/src/common/telemetry.py → sync_push_total / sync_conflict_total
  # ════════════════════════════════════════════════════════════════════════════
  - name: sync_queue
    interval: 60s
    rules:
      # ── S1: 同步积压 > 100 pending mutations ──
      # 客户端定期上报 pending mutation 计数到 sync_queue_depth gauge
      - alert: SyncBacklogHigh
        expr: |
          sum(sync_queue_depth) > 100
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "同步队列积压超过 100（S1）"
          description: |
            当前所有客户端 pending mutations 合计 {{ "{{" }} $value {{ "}}" }}。
            检查 /sync/push 端点健康及数据库写入延迟。
          runbook_url: docs/runbooks/sync-queue.md

      # ── 同步冲突率异常 ──（信息性，warning）
      - alert: SyncConflictRateHigh
        expr: |
          (
            sum(rate(sync_conflict_total[15m]))
            /
            (sum(rate(sync_push_total[15m])) > 0)
          ) > 0.05
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "同步冲突率超过 5%"
          description: |
            最近 15 分钟同步冲突率 {{ "{{" }} $value | humanizePercentage {{ "}}" }}。
            可能原因：多设备并发写入、客户端时钟偏差、冲突解决逻辑回归。
          runbook_url: docs/runbooks/sync-queue.md

  # # ════════════════════════════════════════════════════════════════════════════
  # T-M5-05b: AI Gateway 告警（S1）
  # 指标来源：server/src/common/telemetry.py → ai_gateway_requests_total
  # ════════════════════════════════════════════════════════════════════════════
  - name: ai_gateway
    interval: 60s
    rules:
      # ── S1: AI 错误率超过 5% ──
      - alert: AiErrorRateHigh
        expr: |
          (
            sum(rate(ai_gateway_requests_total{status=~"5.."}[10m]))
            /
            (sum(rate(ai_gateway_requests_total[10m])) > 0)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "AI Gateway 错误率超过 5%（S1）"
          description: |
            最近 10 分钟 AI 请求错误率 {{ "{{" }} $value | humanizePercentage {{ "}}" }}。
            检查 LLM provider 状态（API key、配额、可用性）。
          runbook_url: docs/runbooks/ai-gateway.md

      # ── AI 降级率过高 ──（provider 不可用 fallback 到 rule-based）
      - alert: AiDegradedRateHigh
        expr: |
          (
            sum(rate(ai_gateway_requests_total{degraded="true"}[15m]))
            /
            (sum(rate(ai_gateway_requests_total[15m])) > 0)
          ) > 0.2
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "AI 降级率超过 20%"
          description: |
            最近 15 分钟 AI 降级率 {{ "{{" }} $value | humanizePercentage {{ "}}" }}。
            检查 AI_PROVIDER_API_KEY 配置及 provider 健康。
          runbook_url: docs/runbooks/ai-gateway.md

  # ════════════════════════════════════════════════════════════════════════════
  # T-M5-05b: 数据完整性告警（S0）
  # 指标来源：对账任务写入 reconciliation_inconsistency_total / duplicate_entry_total
  #          （textfile collector 或 nightly audit job）
  # ════════════════════════════════════════════════════════════════════════════
  - name: data_integrity
    interval: 300s
    rules:
      # ── S0: 对账不一致 ──
      - alert: ReconciliationInconsistency
        expr: |
          increase(reconciliation_inconsistency_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "对账发现不一致（S0）"
          description: |
            最近 1 小时对账任务检测到 {{ "{{" }} $value {{ "}}" }} 条不一致记录。
            立即检查同步逻辑、mutation 应用顺序、三端 aggregator。
          runbook_url: docs/runbooks/data-integrity.md

      # ── S0: 重复入账 ──
      - alert: DuplicateEntryDetected
        expr: |
          increase(duplicate_entry_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "检测到重复入账（S0）"
          description: |
            最近 1 小时检测到 {{ "{{" }} $value {{ "}}" }} 笔重复入账。
            检查客户端幂等键生成及服务端 dedup 逻辑。
          runbook_url: docs/runbooks/data-integrity.md

  # ════════════════════════════════════════════════════════════════════════════
  # T-M5-05b: 业务漏斗告警（信息性，warning）
  # 指标来源：server/src/common/telemetry.py → business_signup_total 等
  # ════════════════════════════════════════════════════════════════════════════
  - name: business_funnel
    interval: 300s
    rules:
      # ── 注册率异常下跌 ──（相对上周同期下降 50%）
      - alert: SignupRateDrop
        expr: |
          (
            sum(increase(business_signup_total[24h]))
            /
            sum(increase(business_signup_total[24h] offset 7d))
          ) < 0.5
          and
          sum(increase(business_signup_total[24h] offset 7d)) > 10
        for: 1h
        labels:
          severity: warning
          team: product
        annotations:
          summary: "注册率较上周同期下跌超过 50%"
          description: |
            最近 24h 注册数 {{ "{{" }} $value | humanize {{ "}}" }}，
            较 7 天前同期下跌超过 50%。检查首启同意流、注册链路是否回归。
          runbook_url: docs/runbooks/business-funnel.md
