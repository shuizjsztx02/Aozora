# infra/monitoring/otel-collector-config.yaml — T-M5-05a
# OTel Collector configuration: routes telemetry data to appropriate backends
# - Traces → Tempo
# - Metrics → Prometheus (via OTLP)
# - Logs → Loki (via native push API)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  # Traces → Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics → Prometheus (via OTLP)
  # T-M5-05ab fix (S1-NEW): namespace removed — it prefixed all metric names
  # with "aozora_" (e.g. aozora_api_requests_total), but alert-rules and all
  # 6 Grafana dashboards query the un-prefixed names (api_requests_total).
  prometheus:
    endpoint: 0.0.0.0:8889

  # Logs → Loki (native push API; Loki 3.0 不原生监听 OTLP 4317)
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [loki]

  telemetry:
    logs:
      level: info
