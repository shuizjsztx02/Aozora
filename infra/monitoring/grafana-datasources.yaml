# infra/monitoring/grafana-datasources.yaml — T-M5-05a
# Grafana datasource provisioning for Prometheus, Loki, and Tempo

apiVersion: 1

datasources:
  # Prometheus — Metrics
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  # Loki — Logs
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000

  # Tempo — Traces
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # T-M5-05ab fix (S2-NEW-1): tag must match the span attribute name set
      # in request_id.py ("request.id", dot-separated) — not "request_id".
      tracesToLogs:
        datasourceUid: loki
        tags: ["request.id"]
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: prometheus
        tags: ["request.id"]
        filterByTraceID: true
      nodeGraph:
        enabled: true
