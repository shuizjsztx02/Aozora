# infra/monitoring/dashboards.yml — Grafana dashboard provisioning
# Loads all JSON dashboards from ./dashboards/ at startup.

apiVersion: 1

providers:
  - name: "aozora"
    orgId: 1
    folder: "Aozora"
    type: file
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
