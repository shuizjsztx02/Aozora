# api.conf — A 机 Nginx 实际部署的 aozora 站点配置
#
# 本文件是服务器 A（公网 116.62.196.255 / 内网 192.168.44.13）上
# /usr/local/nginx/conf.d/api.conf 的仓库副本，2026-09-18 实地只读核对。
# upstream 定义在同目录 ups.conf，两者必须一起部署。
#
# ⚠ A 机的 nginx 是**源码编译**安装（/usr/local/nginx，1.16.1），不是发行版包，
#   /etc/nginx 不存在。服务由 /etc/init.d/nginx 托管。详见同目录 DEPLOYED.md。
#
#   部署落点：/usr/local/nginx/conf.d/api.conf
#   生效方式：sudo /usr/local/nginx/sbin/nginx -t && sudo nginx -s reload
#             （或 sudo systemctl reload nginx）
#
# ── 本副本相对服务器磁盘的差异（仅此三处，均为有意）──────────────────
#   [1] proxy_pass 去掉了尾斜杠（服务器上多一个 `/`）——见下方「路径前缀约定」。
#   [2] log_format 与 add_header 的折行合并为单行：服务器上这两处因复制粘贴
#       断行（`X-` 与 `Requested-With` 之间、`upstream_addr` 与其值之间），
#       会产生**含换行的指令值**。合并后语义等同且更规整。
#   [3] 补充了核对注释（`#` 行），不影响指令。
#
# ── 路径前缀约定（关键，勿随手改）──────────────────────────────────────
# 公网入口是 http://116.62.196.255/aozora-api/...，例如
#   /aozora-api/api/v1/health
# 下方 proxy_pass **不带尾斜杠**（`http://aozora-api-ups`），即 nginx 把
# /aozora-api/ 前缀**原样透传**给上游，由应用层的 SharedProxyPrefixMiddleware
# （server/src/main.py）在 ASGI 最外层剥离。不加尾斜杠是刻意的：
#   /aozora-api/api/v1/health --应用剥离--> /api/v1/health
# 不带前缀的请求（回环探活、容器 healthcheck、本机开发）原样透传，两形态共存，
# 因此 server/tests/test_main.py 有对应的前缀剥离用例。
#
# ⚠ 2026-09-18 核对发现的服务端漂移：服务器磁盘上这一行**多一个尾斜杠**
#   （`proxy_pass http://aozora-api-ups/;`），语义会变成"由 nginx 剥离前缀"。
#   该写法写入于 09-11 15:50:12，晚于最后一次 reload（09-11 15:41:24），
#   **尚未生效**——线上实测行为仍是原样透传（双前缀请求返回 404 而非 200 可证）。
#   下一次 reload 前请先把它改回本文件的不带尾斜杠形态，否则语义会静默漂移。
#
# ── 其它已核对项（只读，未改动）──────────────────────────────────────
# • location / 的 allow 列表**是生效的**（未注释），但后面**没有 `deny all`
#   兜底**——nginx 的 allow/deny 按顺序匹配、无匹配则放行，因此这组 allow
#   实际不产生任何限制：所有来源都被放行。且该 location 没有 proxy_pass，
#   请求落到默认静态根 /usr/local/nginx/html（实测返回 200 的默认页）。
#   location /aozora-api/ 同样无 IP 限制，公网可达性完全取决于云安全组。
# • http 块为 access_log off，本文件 access_log 也是注释 —— 全站无访问日志；
#   下面定义的 log_format main 因此无人引用。
# • client_max_body_size 未在此设置，继承 http 块的 1024m；上传体积实际由
#   服务端 MAX_UPLOAD_BYTES 兜底。
# • 本文件含**多业务共享残留**（location / 的 CORS 头与 allow 列表来自模板/
#   其他业务），改动时只动 aozora 相关部分。

log_format main '{"remote_addr":"$remote_addr", "host":"$host", "request": "$request", "status": "$status", "body_bytes_sent": "$body_bytes_sent", "upstream_addr": "$upstream_addr", "request_time": "$request_time", "upstream_response_time":"$upstream_response_time" }';

server {
    listen 80;
    server_name _;

    location / {
        # 内网 IP 段（服务器原文注释：按实际内网网段调整）
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;

        # 指定的公网 IP（服务器原文此处为「示例：公网 IP 1」）
        allow 60.168.132.9;

        # ⚠ 服务器原文此处为被注释的 `#deny all;`——没有它，上面的 allow 全部失效
        #   （nginx 无匹配即放行），本 location 对所有来源开放。若本意是限制来源，
        #   需取消注释；但注意 80 端口是多业务共享的，改动前先确认其它业务依赖。
        #deny all;

        client_body_timeout 300s;
        keepalive_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Access-Control-Allow-Methods *;
        add_header Access-Control-Allow-Origin *;
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
    }

    location /aozora-api/ {
        # 不带尾斜杠 = 原样透传前缀给应用剥离（见文件头「路径前缀约定」）
        proxy_pass http://aozora-api-ups;
        proxy_redirect off;
        # 服务端限流按 X-Forwarded-For 识别客户端
        # （auth/dependencies.py::check_auth_rate_limit，R-M2-04/18），必须透传
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 未设 proxy_read_timeout，用 nginx 默认 60s（AI 网关单次调用预算 < 25s）
    }

    # M8-10：运营后台静态站点（构建产物 admin/dist 上传到 A 机该目录）。
    # 与 /aozora-admin/ 同端口，无独立域名（用户 2026-11-10 决策）；
    # HashRouter + try_files 兜底，刷新子路径不 404。
    location /aozora-admin/ {
        alias /root/Aozora/admin/dist/;
        try_files $uri $uri/ /aozora-admin/index.html;
    }
}