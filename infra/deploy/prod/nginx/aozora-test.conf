# aozora-test.conf — A 机 Nginx 测试入口（截图规划：测试人员 → 公网 IP:8081）
#
# 部署（服务器 A）：
#   sudo cp infra/deploy/prod/nginx/aozora-test.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 8081 是非标端口、按 IP 访问，与 ICP 备案管控（域名 + 80/443）无关，
# 现阶段无域名也能直接跑通测试链路。
#
# 安全边界：只转发到本机回环上的 api-test（127.0.0.1:18080）。
# 公网到 8081 的放行由云安全组控制；测试实例跑 ENV=staging，
# 仅供受控测试人员使用，不放真实用户数据。

server {
    listen      8081;
    server_name _;

    # 附件上传上限 10MB（服务端 MAX_UPLOAD_BYTES）+ multipart 边界余量
    client_max_body_size 12m;

    access_log /var/log/nginx/aozora-test.access.log;
    error_log  /var/log/nginx/aozora-test.error.log;

    location / {
        proxy_pass http://127.0.0.1:18080;

        # 服务端限流按 X-Forwarded-For / X-Real-IP 识别客户端
        # （auth/dependencies.py::check_auth_rate_limit，R-M2-04/18），必须透传
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 网关单次调用预算 < 25s（客户端取消线），代理侧留 30s 余量
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
