# ups.conf — A 机 Nginx 实际部署的 aozora upstream 定义
#
# 本文件是服务器 A 上 /usr/local/nginx/conf.d/ups.conf 的仓库副本（2026-09-18 核对）。
# 与同目录 api.conf 成对部署；nginx.conf 通过
#   include /usr/local/nginx/conf.d/*.conf;
# 同时引入两者。
#
#   部署落点：/usr/local/nginx/conf.d/ups.conf
#
# ⚠ 上游地址用的是 A 机自身 eth0 的**内网 IP**（而非 127.0.0.1）。该网卡由
#   DHCP 动态分配，IP 变更时 upstream 会静默失联。容器发布在 0.0.0.0:18080
#   （docker-compose.prod.yml 的 api-test），走回环地址同样可达且更稳。
#
# keepalive 500：与 api.conf 中 `proxy_http_version 1.1` +
# `proxy_set_header Connection ""` 配合，复用上游长连接。

upstream aozora-api-ups {
    server 192.168.44.13:18080;
    keepalive 500;
}