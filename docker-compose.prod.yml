# docker-compose.prod.yml — T-M6-01a（双服务器拓扑，见 docs/adr/ADR-001 回填）
#
# 与 staging/dev compose 的关键差异：**本文件不含数据库服务。**
# PostgreSQL 18.6 跑在独立的服务器 B（内网 192.168.44.12），本文件只部署
# 服务器 A（192.168.44.13 / 公网 116.62.196.255）上的业务服务。
#
# 一台 A 机两个实例，用 profile 隔离（互不干扰，可分别启停）：
#   测试实例  api-test  ENV=staging     主机端口 0.0.0.0:18080   → B:15432/aozora_test
#   生产实例  api-prod  ENV=production  主机端口 127.0.0.1:8080  → B:5432 /aozora_prod
#
#   启用测试：docker compose -f docker-compose.prod.yml --profile test up -d --build
#   启用生产：docker compose -f docker-compose.prod.yml --profile prod up -d --build
#
# api-test 为兼容现有 Nginx 的 A 机内网地址上游而绑 0.0.0.0:18080；安全组不得
# 放行 TCP 18080 的公网入方向。公网流量仍必须经 Nginx 转发
# （测试：80 端口 + `/aozora-api/` 前缀 → 18080；生产：443 → 8080）。
# Nginx 实际形态见 infra/deploy/prod/nginx/DEPLOYED.md。
# 所有变量取自仓库根 .env（服务器本机文件，不进 git）：
# 模板见 infra/deploy/prod/deploy.env.example，操作步骤见 infra/deploy/prod/RUNBOOK.md。

x-api-build: &api-build
  build:
    context: .
    dockerfile: server/Dockerfile
  restart: unless-stopped
  healthcheck:
    test:
      - "CMD-SHELL"
      - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')\" || exit 1"
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 15s

# 两实例共享的运行时环境（映射形式，允许各 service 用 << 合并追加自己的键）
x-api-env: &api-env
  # 附件与导出文件的持久卷目录（D-EXEC-05 对象存储到位前的容器级兜底；
  # 镜像已在 /data 预建目录并 chown 给运行用户）
  UPLOAD_DIR: /data/uploads
  EXPORT_DIR: /data/exports
  AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
  AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-qwen3.7-flash}
  AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  # 本文件不部署 OTel Collector，关闭埋点导出避免后台重试噪音；
  # 上 observability 栈时再改回 true（见 RUNBOOK 第 7 节）
  ENABLE_TELEMETRY: "false"

services:
  api-test:
    <<: *api-build
    profiles: ["test"]
    container_name: aozora-api-test
    ports:
      - "0.0.0.0:18080:8000"
    volumes:
      - api-test-data:/data
    environment:
      <<: *api-env
      # 测试实例跑 staging：保留 DEV_AUTH_CODE=000000 全功能可测
      # （短信供应商未接入/D-EXEC-03，production 下手机验证码登录不可用）
      ENV: staging
      DATABASE_URL: ${TEST_DATABASE_URL:?在 .env 中设置，指向服务器 B 的 aozora_test}
      SECRET_KEY: ${TEST_SECRET_KEY:?在 .env 中设置（openssl rand -hex 32）}
      DEV_AUTH_CODE: "000000"
      CORS_ORIGINS: "*"
      LOG_LEVEL: INFO
      # 测试环境游客配额临时放宽，方便连测；生产实例见 PROD_AI_QUOTA
      AI_DAILY_QUOTA_GUEST: ${TEST_AI_QUOTA:-100000}

  api-prod:
    <<: *api-build
    profiles: ["prod"]
    container_name: aozora-api
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - api-prod-data:/data
    environment:
      <<: *api-env
      ENV: production
      DATABASE_URL: ${PROD_DATABASE_URL:?在 .env 中设置，指向服务器 B 的 aozora_prod}
      SECRET_KEY: ${PROD_SECRET_KEY:?在 .env 中设置（openssl rand -hex 32）}
      # 生产安全校验器硬约束（config.py::_check_production_safety）：
      # DEV_AUTH_CODE 必须为空、CORS 必须为 https://[sub.]aozora.app 列表、
      # AI_PROVIDER_API_KEY 必填。ENV=production 下不满足即拒绝启动——
      # 域名/备案未落地前生产实例保持停用（见 RUNBOOK 第 7 节）。
      DEV_AUTH_CODE: ""
      CORS_ORIGINS: ${PROD_CORS_ORIGINS:?生产 CORS，逗号分隔的 https://*.aozora.app 列表}
      LOG_LEVEL: INFO
      AI_DAILY_QUOTA_GUEST: ${PROD_AI_QUOTA:-20}

volumes:
  api-test-data:
  api-prod-data:
