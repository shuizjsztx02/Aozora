# T-M5-02c: CI secret scanning — detects accidental secret commits.
#
# Uses gitleaks to scan:
#   1. PR commit diffs (incremental, on every push/PR)
#   2. Full git history (weekly cron, Monday 03:00 UTC)

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full-history scan every Monday at 03:00 UTC.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for weekly cron scans; PRs use default fetch.
          fetch-depth: ${{ github.event_name == 'schedule' && '0' || '0' }}

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the job when secrets are detected.
          GITLEAKS_LICENSE: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On PRs: scan only the diff.  On cron/push: full history.
          config-path: ""
