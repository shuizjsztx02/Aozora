name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      # T-M5-02d: dependency vulnerability scan (high+ severity).
      - run: npm audit --audit-level=high

  android:
    name: Android Compile & JVM Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.1.0"
      - run: npm ci
        working-directory: app
      - run: bash ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      # T-M5-01d: actually run androidTest classes on emulator (P0#2).
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          target: google_apis
          script: bash ./gradlew :app:connectedDebugAndroidTest --no-daemon
      # T-M5-01d / P2#32: upload JUnit XML so failures show per-test, not just stdout.
      - name: Upload androidTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: app/build/outputs/androidTest-results/
      # T-M5-02d: OWASP DependencyCheck — Android dependency CVE scan (CVSS >= 7 fails).
      - run: bash ./gradlew :app:dependencyCheckAnalyze -PfailBuildOnCVSS=7 --no-daemon

  server:
    name: Server Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      # T-M5-02d: dependency vulnerability scan.
      - run: pip install pip-audit && pip-audit -r pyproject.toml
      - run: pytest tests/ --tb=short -q
