[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aozora-server"
version = "0.1.0"
description = "Aozora production API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "python-dotenv>=1.0,<2",
    "alembic>=1.14,<2",
    "pyjwt>=2.9,<3",
    "bcrypt>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    # R-M2-20: use the mainstream ``httpx`` (pulled transitively by
    # fastapi's TestClient); ``httpx2`` is a non-standard fork we don't use.
    "httpx>=0.27,<1",
    "aiosqlite>=0.20,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:httpx",
    # asyncio.run() on Windows ProactorEventLoop leaves unclosed loop warnings
    "ignore::ResourceWarning",
]
