[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aozora-server"
version = "0.1.0"
description = "Aozora production API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "python-dotenv>=1.0,<2",
    "alembic>=1.14,<2",
    "pyjwt>=2.9,<3",
    "bcrypt>=4.0,<5",
    # T-M4-01: outbound LLM provider calls (DashScope OpenAI-compatible mode).
    "httpx>=0.27,<1",
    # T-M4-02: ActionProposal server-side validation (Draft-07 parity with ajv/TS).
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    # R-M2-20: ``httpx`` moved to main dependencies in T-M4-01 (the AI
    # gateway needs it at runtime); TestClient keeps using the same one.
    "aiosqlite>=0.20,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:httpx",
    # asyncio.run() on Windows ProactorEventLoop leaves unclosed loop warnings
    "ignore::ResourceWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
]
ignore = [
    "E402",  # module level import not at top (circular dependency avoidance)
    "E501",  # line too long (handled by formatter)
    "F811",  # redefinition of unused name (common in pytest fixtures)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # assert used in tests
    "ARG001", # unused function args (fixtures)
    "ARG002", # unused method args
]
