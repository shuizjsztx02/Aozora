[alembic]
script_location = src/migrations
prepend_sys_path = .
# The URL is intentionally empty: ``src/migrations/env.py`` overrides it
# from ``Settings.database_url`` at runtime. Leaving it blank avoids a
# misleading "invalid URL" error — missing DATABASE_URL is reported by
# pydantic-settings on Settings load instead.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
