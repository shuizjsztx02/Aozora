[alembic]
script_location = src/migrations
prepend_sys_path = .
# The URL is intentionally empty: ``src/migrations/env.py`` overrides it
# from ``Settings.database_url`` at runtime (see env.py line 24-25).
# Leaving it blank avoids a misleading "invalid URL" error - missing
# DATABASE_URL is reported by pydantic-settings on Settings load instead.
# If env.py ever stops reading Settings.database_url, all alembic calls
# will become no-op; verify-backup.sh asserts this invariant indirectly
# via the alembic_version table check.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
